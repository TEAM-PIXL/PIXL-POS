name: Compendium

on:
  push:
    branches:
      - 'development'
      - 'quality'
      - 'production'
  pull_request:
    branches:
      - 'development'
      - 'quality'
      - 'production'

jobs:
  Compendium:
    uses: parkermmr/compendium/.github/workflows/compendium-java.yml@main
    with: 
      java-version: "21"
      disribution: "corretto"
      ref-name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
